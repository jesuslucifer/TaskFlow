<form action="" [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
  <label for="">
    Название
    <input class="form__input" type="text" formControlName="name" placeholder="Название">
    @if(form.controls["name"].invalid && form.controls["name"].touched){
    <div class="error">
      @if(form.get('name')?.errors?.['required']){
      <div class="error">Название обязательно</div>
      }
    </div>

    }
  </label>
  <label for="">
    Описание
    <input type="text" class="form__input" formControlName="description" placeholder="Описание">

  </label>
  <label for="" class="project-form__select">
    Приоритет
    <select name="priority" formControlName="priority" class="form__select">
      <option [value]="priorityEnum.CRITICAL">Критический</option>
      <option [value]="priorityEnum.HIGH" selected>Высокий</option>
      <option [value]="priorityEnum.MEDIUM">Средний</option>
      <option [value]="priorityEnum.LOW">Низкий</option>
    </select>
  </label>
  <label class="project__date">
    Сроки проекта
    <label>
      Дата
      <input type="date" class="form__input" formControlName="dateTo" placeholder="Проект 1">
      @if(form.controls["dateTo"].invalid && form.controls["dateTo"].touched){
      <div class="error">
        @if(form.get('dateTo')?.errors?.['required']){
        <div class="error">Дата обязательна</div>
        }
        @if(form.get('dateTo')?.errors?.['pastDate']) {
        <div class="error">Нельзя выбрать дату в прошлом</div>
        }

      </div>

      }
    </label>
    <label>
      Время
      <input type="time" class="form__input" formControlName="timeLeft" placeholder="Проект 1">
      @if(form.controls["timeLeft"].invalid && form.controls["timeLeft"].touched){
      <div class="error">
        @if(form.get('timeLeft')?.errors?.['required']){
        <div class="error">Время обязательно</div>
        }
      </div>

      }
    </label>
  </label>
  <label class="category-field">
    Категории
    <div class="input-with-tags">
      @for (cat of category; track $index) {
      <div class="tag">
        {{ cat }}
        <button type="button" (click)="removeCategory(cat)">✕</button>
      </div>
      }
      <input type="text" class="tag-input" placeholder="Введите категорию и нажмите Enter" [formControl]="categoryInput"
        (keydown.enter)="onEnterCategory($event)" />
    </div>
  </label>

  <button class="form__btn" type="submit" [disabled]="form.invalid">Создать</button>
</form>
