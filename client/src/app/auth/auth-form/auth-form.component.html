<form class="auth__form" [formGroup]="form" (ngSubmit)="onSubmit()">

  @if(isReg){
  <label class="auth-control__label">
    Имя пользователя
    <input class="auth__input" formControlName="username" placeholder="Ivan" type="text">
    @if(form.controls["username"].invalid && form.controls["username"].touched){
    <div class="error">
      @if(form.get('username')?.errors?.['required']){
      <div class="error">Имя обязательно</div>
      }
    </div>

    }

  </label>
  }

  @if(isReg){
  <label class="auth-control__label">
    Email
    <input class="auth__input" formControlName="email" placeholder="example@mail.ru" type="text">

    @if(form.controls["email"].invalid && form.controls["email"].touched){
    <div class="error">
      @if(form.get('email')?.errors?.['required']){
      <div class="error">Email обязателен</div>
      }
      @if(form.get('email')?.errors?.['email']){
      <div class="error">Неверный формат email</div>
      }
    </div>

    }

  </label>
  } @else {
  <label class="auth-control__label">
    Email или Имя пользователя
    <input class="auth__input" formControlName="usernameOrEmail" placeholder="example@mail.ru" type="text">
    @if(form.controls["usernameOrEmail"].invalid && form.controls["usernameOrEmail"].touched){
    <div class="error">
      @if(form.get('usernameOrEmail')?.errors?.['required']){
      <div class="error">Обязательное поле</div>
      }
    </div>
    }

  </label>
  }

  <label class="auth-control__label">
    Пароль
    <div class="password-input">
      <input class="auth__input" formControlName="password" [type]="isEyeVisible() ?  'text' : 'password'"
        placeholder="******">
      <div class="password__eye" (click)="isEyeVisible.set(!isEyeVisible())">
        @if(isEyeVisible()){
        <mat-icon>visibility_on</mat-icon>
        }@else {
        <mat-icon>visibility_off</mat-icon>
        }
      </div>
    </div>
    @if(form.controls["password"].invalid && form.controls["password"].touched){
    <div class="error">
      @if(form.get('password')?.errors?.['required']){
      <div class="error">Пароль обязателен</div>
      }
      @if(form.get('password')?.errors?.['minlength']){
      <div class="error">Минимум 6 символов</div>
      }
    </div>

    }

  </label>

  <button class="auth__btn" type="submit" [disabled]="form.invalid">Продолжить</button>

  @if(isReg){
  <h4>Уже есть аккаунт? <a [routerLink]="['/login']"> Войти </a> </h4>
  }@else if(!isReg) {
  <h4>Еще нет аккаунта? <a [routerLink]="['/sign-up']"> Зарегистрироваться </a> </h4>
  }
</form>
