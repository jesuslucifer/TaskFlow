@if(task$ | async; as task){
<div class="container">
  <div class="project">
    <div class="project__main">
      <header class="header">
        <div class="project__info">
          <span class="project__name">{{task.name}}</span>
          <form>
            <div class="project__description">
              <h4>Описание</h4>
              @if(!isEditingNameDesc){
              <div>
                <div class="description__text">{{ task.description }}</div>
                <!-- @if(task.id == me()?.id){ -->
                <button class="edit-btn" (click)="toggleEditNameDesc()">Редактировать</button>
                <!-- } -->
              </div>
              }@else{
              <div>
                <input type="text" formControlName="name" placeholder="Имя проекта" />
                <textarea formControlName="description" placeholder="Описание проекта"></textarea>
                <button class="edit-btn" (click)="saveNameDesc()">Сохранить</button>
                <button class="cancel-btn" (click)="toggleEditNameDesc()">Отмена</button>
              </div>
              }
            </div>

          </form>

        </div>
      </header>
      <div class="view__type">
      </div>
    </div>
    <div class="project__side-bar">
      <div class="side-bar__item">
        <h3>Информация о проекте</h3>
        <app-task-page-info [task]="task" [form]="form" [profileId]="profileId"></app-task-page-info>
        <div class="project__executors info__item">
          <div class="executors__add">
            <h5>Исполнители</h5>
            @if(task. id == me()?.id){
            <button (click)="openCreateDialog()" class="open-btn">+</button>
            }
          </div>


        </div>
      </div>
    </div>

  </div>

</div>
}
