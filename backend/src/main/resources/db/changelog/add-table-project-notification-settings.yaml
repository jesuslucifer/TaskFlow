databaseChangeLog:
  - changeSet:
      id: add-table-project-notification-settings.yaml
      author: jesuslucifer
      changes:
        - createTable:
            tableName: project_notification_settings
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                  autoIncrement: true
              - column:
                  name: user_id
                  type: bigint
              - column:
                  name: project_id
                  type: bigint
              - column:
                  name: notification_enabled
                  type: boolean
              - column:
                  name: delivery_method
                  type: nvarchar(20)