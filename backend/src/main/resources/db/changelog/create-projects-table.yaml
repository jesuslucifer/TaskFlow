databaseChangeLog:
  - changeSet:
      id: 7
      author: kisliashka100
      changes:
        - createTable:
            tableName: projects
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: project_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: date_to
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: time_left
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: create_user_id
                  type: bigint
                  constraints:
                    nullable: false