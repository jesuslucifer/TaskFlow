databaseChangeLog:
  - changeSet:
      id: add-table-categories
      author: jesuslucifer
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                  autoIncrement: true
              - column:
                  name: project_id
                  type: bigint
              - column:
                  name: name
                  type: NVARCHAR(100)